<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show do Milhão / Quem Quer Ser Um Milionário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b1145 0%, #08041a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(20, 15, 45, 0.85);
            border: 2px solid #4a38a6;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(114, 9, 183, 0.4);
            padding: 25px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* TELA DE CARREGAMENTO / INÍCIO */
        .setup-screen, .game-over-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        h1 {
            color: #ffd700;
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        /* ESTILO PARA A SELEÇÃO DE TEMAS */
        .theme-select-container {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
            width: 100%;
            max-width: 320px;
        }

        .theme-select-container label {
            font-size: 1rem;
            color: #ffd700;
            font-weight: 600;
        }

        .theme-select {
            background: #0d0726;
            color: #ffffff;
            border: 2px solid #4a38a6;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-select:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #000;
            font-weight: 800;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff3366 0%, #a1002b 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .btn-stop:hover {
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
        }

        .btn:disabled {
            background: #555 !important;
            color: #888 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* TELA DO JOGO */
        .game-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .header-game {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d0726;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #322380;
        }

        .timer-box {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff3366;
        }

        .lifelines {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-lifeline {
            background: #251666;
            border: 1px solid #5a43cf;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-lifeline:hover:not(:disabled) {
            background: #3c26a6;
            border-color: #ffd700;
        }

        /* ESTILO BOTÃO DE AJUDA USADO (CORTADO COM X) */
        .btn-lifeline:disabled {
            background: #120a2e !important;
            border-color: #332255 !important;
            color: #666 !important;
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: 0.6;
        }

        .btn-lifeline:disabled::after {
            content: "✕";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.2rem;
            color: #ff3366;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 5px rgba(255, 51, 102, 0.8);
            pointer-events: none;
        }

        /* PAINEL DE VALORES (ACERTAR, PARAR, ERRAR) */
        .prizes-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .prize-card {
            background: #0d0726;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #322380;
        }

        .prize-card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .prize-card .val {
            font-size: 1.1rem;
            font-weight: 800;
            margin-top: 4px;
        }

        .prize-card.correct { border-color: #00ff68; }
        .prize-card.correct .label { color: #00ff68; }
        .prize-card.correct .val { color: #00ff68; }

        .prize-card.stop { border-color: #ffd700; }
        .prize-card.stop .label { color: #ffd700; }
        .prize-card.stop .val { color: #ffd700; }

        .prize-card.wrong { border-color: #ff3366; }
        .prize-card.wrong .label { color: #ff3366; }
        .prize-card.wrong .val { color: #ff3366; }

        /* ESTRUTURA DA PERGUNTA */
        .question-box {
            background: linear-gradient(135deg, #180e42 0%, #0b0526 100%);
            border: 2px solid #ffd700;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.2);
        }

        /* OPÇÕES DE RESPOSTA */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .answers-grid {
                grid-template-columns: 1fr;
            }
            .header-game {
                flex-direction: column;
                gap: 10px;
            }
            .prizes-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .btn-answer {
            background: #120a36;
            border: 2px solid #3c26a6;
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-answer:hover:not(:disabled) {
            background: #231363;
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        .btn-answer .prefix {
            color: #ffd700;
            font-weight: 800;
        }

        /* ESTADOS DE RESPOSTA */
        .btn-answer.correct {
            background: #008037 !important;
            border-color: #00ff68 !important;
            color: #fff;
            animation: pulse 0.5s infinite alternate;
        }

        .btn-answer.wrong {
            background: #b30000 !important;
            border-color: #ff3333 !important;
            color: #fff;
        }

        .btn-answer.hidden {
            visibility: hidden;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        .loading-text {
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 10px;
        }

        /* POPUP MENU DE AJUDAS */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(8, 4, 26, 0.95);
            border-radius: 20px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
            padding: 20px;
        }

        .modal-overlay h2 {
            color: #ffd700;
            font-size: 1.6rem;
            text-align: center;
        }

        .help-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        /* MODAL DAS CARTAS UNO */
        .cards-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .uno-card {
            width: 90px;
            height: 130px;
            background: linear-gradient(135deg, #e63946 0%, #b7094c 100%);
            border: 3px solid #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, background 0.3s ease;
            user-select: none;
        }

        .uno-card:hover:not(.revealed) {
            transform: translateY(-10px) scale(1.05);
        }

        .uno-card.back {
            background: radial-gradient(circle, #ff0055 0%, #5a002c 100%);
            color: #ffd700;
        }

        .uno-card.revealed {
            background: #ffffff;
            color: #0d0726;
            border-color: #ffd700;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- POPUP MENU DE AJUDAS -->
    <div id="help-menu-modal" class="modal-overlay">
        <h2>Escolha uma ajuda:</h2>
        <div class="help-options">
            <button class="btn-lifeline" id="btn-cards" style="padding: 15px; font-size: 1.1rem;" onclick="abrirModalCartas()">Eliminar erradas</button>
            <button class="btn-lifeline" id="btn-skip" style="padding: 15px; font-size: 1.1rem;" onclick="usarPular()">Pular pergunta</button>
        </div>
        <button class="btn btn-stop" style="margin-top: 10px; padding: 10px 25px; font-size: 0.9rem;" onclick="fecharModalAjudas()">Fechar</button>
    </div>

    <!-- MODAL CARTAS DE UNO -->
    <div id="cards-modal" class="modal-overlay">
        <h2>Escolha uma carta para eliminar respostas erradas:</h2>
        <div class="cards-grid" id="cards-container">
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
        </div>
        <p id="cards-msg" style="color: #00ffcc; font-size: 1.1rem; height: 30px;"></p>
    </div>

    <!-- TELA INICIAL / CARREGAMENTO -->
    <div id="setup-screen" class="setup-screen">
        <h1>QUEM QUER SER UM MILIONÁRIO?</h1>
        <p class="loading-text" id="status-msg">Carregando as perguntas do jogo...</p>
        
        <!-- SELEÇÃO DE TEMA -->
        <div class="theme-select-container" id="theme-container">
            <label for="theme-select">Escolha o Tema do Jogo:</label>
            <select id="theme-select" class="theme-select">
                <option value="GERAL">GERAL (Todos os temas)</option>
            </select>
        </div>

        <button class="btn" id="btn-start" style="display: none;" onclick="comecarJogoDirectamente()">Iniciar Jogo</button>
        <p id="error-msg" style="color: #ff3366; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>

    <!-- TELA DO JOGO -->
    <div id="game-screen" class="game-screen">
        <div class="header-game">
            <div class="timer-box">Tempo: <span id="timer">30</span>s</div>
            <div class="lifelines">
                <button class="btn-lifeline" id="btn-main-help" onclick="abrirModalAjudas()">Pedir Ajuda</button>
            </div>
            <button class="btn btn-stop" style="padding: 8px 18px; font-size: 0.9rem;" onclick="pararJogo()">PARAR</button>
        </div>

        <!-- PAINEL DE VALORES DA RODADA -->
        <div class="prizes-dashboard">
            <div class="prize-card wrong">
                <div class="label">Se Errar</div>
                <div class="val" id="val-errar">R$ 0</div>
            </div>
            <div class="prize-card stop">
                <div class="label">Se Parar</div>
                <div class="val" id="val-parar">R$ 0</div>
            </div>
            <div class="prize-card correct">
                <div class="label">Se Acertar</div>
                <div class="val" id="val-acertar">R$ 1.000</div>
            </div>
        </div>

        <div class="question-box" id="question-text">
            Carregando pergunta...
        </div>

        <div class="answers-grid" id="answers-container">
            <button class="btn-answer" onclick="selecionarResposta(0)"><span class="prefix">A:</span> <span class="text"></span></button>
            <button class="btn-answer" onclick="selecionarResposta(1)"><span class="prefix">B:</span> <span class="text"></span></button>
            <button class="btn-answer" onclick="selecionarResposta(2)"><span class="prefix">C:</span> <span class="text"></span></button>
            <button class="btn-answer" onclick="selecionarResposta(3)"><span class="prefix">D:</span> <span class="text"></span></button>
        </div>
    </div>

    <!-- TELA FINAL -->
    <div id="game-over-screen" class="game-over-screen" style="display: none;">
        <h1 id="game-over-title">FIM DE JOGO!</h1>
        <p id="game-over-msg" style="font-size: 1.3rem;">Você ganhou:</p>
        <h2 id="final-prize" style="color: #00ffcc; font-size: 2.5rem; margin: 10px 0;">R$ 0</h2>
        <button class="btn" onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>
</div>

<script>
    // ID da sua planilha pública pré-definido
    const SHEET_ID = '1tvhiX8xjqUZoLGyZN3Uf-bTUPCRvHTY7Hzk-ZHn3avU';

    // Escala de Prêmios Numéricos (níveis do jogo)
    const premiosValores = [
        1000, 2000, 3000, 5000, 10000,
        20000, 50000, 100000, 300000, 500000,
        1000000
    ];

    let todasPerguntas = [];
    let perguntas = [];
    let nivelAtual = 0;
    let indiceRespostaCorreta = -1;
    let tempoRestante = 30;
    let timerInterval = null;
    let bloqueado = false;
    let valorAcumuladoAtual = 0;

    // Controle de ajudas
    let ajudaCartasUsada = false;
    let ajudaPularUsada = false;

    // Formatar número para moeda R$
    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
    }

    // Carregamento Inicial
    window.addEventListener('DOMContentLoaded', () => {
        carregarPerguntasAutomaticamente();
    });

    async function carregarPerguntasAutomaticamente() {
        const errorMsg = document.getElementById('error-msg');
        const statusMsg = document.getElementById('status-msg');
        const btnStart = document.getElementById('btn-start');
        const themeContainer = document.getElementById('theme-container');

        try {
            todasPerguntas = await carregarPerguntasPlanilha(SHEET_ID);
            
            if (todasPerguntas.length === 0) {
                throw new Error("Nenhuma pergunta foi encontrada na planilha.");
            }

            preencherSelectTemas(todasPerguntas);

            statusMsg.innerText = "Pronto para jogar!";
            themeContainer.style.display = 'flex';
            btnStart.style.display = 'inline-block';
        } catch (err) {
            statusMsg.style.display = 'none';
            errorMsg.innerText = "Erro ao carregar as perguntas. Certifique-se de que publicou a planilha na Web (Arquivo > Compartilhar > Publicar na Web).";
            console.error(err);
        }
    }

    function preencherSelectTemas(lista) {
        const select = document.getElementById('theme-select');
        select.innerHTML = '<option value="GERAL">GERAL (Todos os temas)</option>';

        // Extrai todos os temas únicos existentes na planilha
        const temasUnicos = new Set();
        lista.forEach(p => {
            if (p.tema && p.tema.trim() !== '' && p.tema.toUpperCase() !== 'GERAL') {
                temasUnicos.add(p.tema.trim());
            }
        });

        // Adiciona cada tema único como uma opção no select
        temasUnicos.forEach(tema => {
            const opt = document.createElement('option');
            opt.value = tema;
            opt.innerText = tema;
            select.appendChild(opt);
        });
    }

    async function carregarPerguntasPlanilha(sheetId) {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error("Não foi possível acessar a planilha.");
        
        const text = await response.text();
        const linhas = parseCSV(text);

        if (linhas.length < 2) throw new Error("A planilha precisa ter um cabeçalho e pelo menos 1 pergunta.");

        const header = linhas[0].map(h => h.toLowerCase().trim());
        const idxPergunta = header.indexOf('pergunta');
        const idxCorreta = header.indexOf('correta');
        const idxErrada1 = header.indexOf('errada1');
        const idxErrada2 = header.indexOf('errada2');
        const idxErrada3 = header.indexOf('errada3');
        const idxTema = header.indexOf('tema');

        if (idxPergunta === -1 || idxCorreta === -1 || idxErrada1 === -1 || idxErrada2 === -1 || idxErrada3 === -1) {
            throw new Error("Colunas obrigatórias não encontradas. O cabeçalho deve conter: pergunta, correta, errada1, errada2, errada3.");
        }

        const listaPerguntas = [];
        for (let i = 1; i < linhas.length; i++) {
            const row = linhas[i];
            if (row[idxPergunta]) {
                listaPerguntas.push({
                    pergunta: row[idxPergunta],
                    correta: row[idxCorreta],
                    erradas: [row[idxErrada1], row[idxErrada2], row[idxErrada3]],
                    tema: (idxTema !== -1 && row[idxTema]) ? row[idxTema].trim() : 'Geral'
                });
            }
        }

        return listaPerguntas;
    }

    function parseCSV(text) {
        let lines = [];
        let row = [];
        let entry = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i+1];

            if (c === '"') {
                if (inQuotes && nextC === '"') { entry += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                row.push(entry.trim());
                entry = '';
            } else if ((c === '\r' || c === '\n') && !inQuotes) {
                if (c === '\r' && nextC === '\n') { i++; }
                row.push(entry.trim());
                if (row.length > 0 && row.some(x => x !== '')) lines.push(row);
                row = [];
                entry = '';
            } else {
                entry += c;
            }
        }
        if (entry || row.length > 0) {
            row.push(entry.trim());
            lines.push(row);
        }
        return lines;
    }

    function comecarJogoDirectamente() {
        const temaSelecionado = document.getElementById('theme-select').value;

        // Filtrar perguntas conforme a escolha
        if (temaSelecionado === "GERAL") {
            perguntas = [...todasPerguntas];
        } else {
            perguntas = todasPerguntas.filter(p => p.tema.toLowerCase() === temaSelecionado.toLowerCase());
        }

        if (perguntas.length === 0) {
            alert(`Não existem perguntas cadastradas para o tema: ${temaSelecionado}`);
            return;
        }

        perguntas.sort(() => Math.random() - 0.5);

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        
        nivelAtual = 0;
        valorAcumuladoAtual = 0;
        ajudaCartasUsada = false;
        ajudaPularUsada = false;

        document.getElementById('btn-cards').disabled = false;
        document.getElementById('btn-skip').disabled = false;
        document.getElementById('btn-main-help').disabled = false;

        exibirPergunta();
    }

    function exibirPergunta() {
        bloqueado = false;
        resetarBotoes();

        if (nivelAtual >= premiosValores.length) {
            finalizarJogo(true);
            return;
        }

        if (perguntas.length === 0) {
            finalizarJogo(false, "Sem mais perguntas no banco de dados para este tema!");
            return;
        }

        // Atualizar Dashboard de Prêmios
        const valorAcertar = premiosValores[nivelAtual];
        const valorParar = valorAcumuladoAtual * 0.5; // Perde 50%
        const valorErrar = valorAcumuladoAtual * 0.2; // Perde 80% (fica com 20%)

        document.getElementById('val-acertar').innerText = formatarMoeda(valorAcertar);
        document.getElementById('val-parar').innerText = formatarMoeda(valorParar);
        document.getElementById('val-errar').innerText = formatarMoeda(valorErrar);

        // Pega a primeira pergunta do deck e remove para não repetir
        const q = perguntas.shift();
        document.getElementById('question-text').innerText = q.pergunta;

        const todasOpcoes = [
            { texto: q.correta, eCorreta: true },
            { texto: q.erradas[0], eCorreta: false },
            { texto: q.erradas[1], eCorreta: false },
            { texto: q.erradas[2], eCorreta: false }
        ];

        todasOpcoes.sort(() => Math.random() - 0.5);

        const btns = document.querySelectorAll('.btn-answer');
        btns.forEach((btn, idx) => {
            btn.querySelector('.text').innerText = todasOpcoes[idx].texto;
            btn.dataset.correta = todasOpcoes[idx].eCorreta;
            if (todasOpcoes[idx].eCorreta) {
                indiceRespostaCorreta = idx;
            }
        });

        iniciarTimer();
    }

    function iniciarTimer() {
        clearInterval(timerInterval);
        tempoRestante = 30;
        document.getElementById('timer').innerText = tempoRestante;

        timerInterval = setInterval(() => {
            tempoRestante--;
            document.getElementById('timer').innerText = tempoRestante;
            if (tempoRestante <= 0) {
                clearInterval(timerInterval);
                finalizarJogo(false, "O tempo acabou!");
            }
        }, 1000);
    }

    function selecionarResposta(index) {
        if (bloqueado) return;
        bloqueado = true;
        clearInterval(timerInterval);

        const btns = document.querySelectorAll('.btn-answer');
        const btnSelecionado = btns[index];
        const eCorreta = btnSelecionado.dataset.correta === "true";

        if (eCorreta) {
            btnSelecionado.classList.add('correct');
            valorAcumuladoAtual = premiosValores[nivelAtual];
            setTimeout(() => {
                nivelAtual++; // Avança de nível apenas quando acerta
                exibirPergunta();
            }, 1500);
        } else {
            btnSelecionado.classList.add('wrong');
            btns[indiceRespostaCorreta].classList.add('correct');
            setTimeout(() => {
                finalizarJogo(false, "Resposta Incorreta!");
            }, 2000);
        }
    }

    /* --- LÓGICA DO POPUP DE AJUDAS --- */
    function abrirModalAjudas() {
        if (bloqueado) return;
        document.getElementById('help-menu-modal').style.display = 'flex';
    }

    function fecharModalAjudas() {
        document.getElementById('help-menu-modal').style.display = 'none';
    }

    function verificarAjudasEsgotadas() {
        if (ajudaCartasUsada && ajudaPularUsada) {
            document.getElementById('btn-main-help').disabled = true;
        }
    }

    /* --- LÓGICA DA AJUDA: ELIMINAR ERRADAS --- */
    function abrirModalCartas() {
        if (ajudaCartasUsada) return;
        
        fecharModalAjudas();

        const container = document.getElementById('cards-container');
        container.innerHTML = `
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
            <div class="uno-card back" onclick="virarCarta(this)">UNO</div>
        `;
        document.getElementById('cards-msg').innerText = "";
        document.getElementById('cards-modal').style.display = 'flex';
    }

    function virarCarta(elemento) {
        if (elemento.classList.contains('revealed')) return;

        const numerosDisponiveis = [0, 1, 2, 3];
        const numeroSorteado = numerosDisponiveis[Math.floor(Math.random() * numerosDisponiveis.length)];

        const todasCartas = document.querySelectorAll('.uno-card');
        todasCartas.forEach(carta => {
            carta.classList.remove('back');
            carta.classList.add('revealed');
            carta.onclick = null;
        });

        elemento.innerText = numeroSorteado;
        
        let restantes = [0, 1, 2, 3].filter(n => n !== numeroSorteado);
        todasCartas.forEach(carta => {
            if (carta !== elemento) {
                carta.innerText = restantes.pop();
            }
        });

        document.getElementById('cards-msg').innerText = `Você eliminou ${numeroSorteado} resposta(s) errada(s)!`;

        ajudaCartasUsada = true;
        document.getElementById('btn-cards').disabled = true;
        verificarAjudasEsgotadas();

        setTimeout(() => {
            document.getElementById('cards-modal').style.display = 'none';
            aplicarEliminacaoCartas(numeroSorteado);
        }, 2000);
    }

    function aplicarEliminacaoCartas(qtd) {
        if (qtd <= 0) return;

        const btns = document.querySelectorAll('.btn-answer');
        let eliminados = 0;

        btns.forEach((btn, idx) => {
            if (idx !== indiceRespostaCorreta && eliminados < qtd && !btn.classList.contains('hidden')) {
                btn.classList.add('hidden');
                eliminados++;
            }
        });
    }

    /* --- LÓGICA DA AJUDA: PULAR PERGUNTA --- */
    function usarPular() {
        if (ajudaPularUsada) return;
        
        ajudaPularUsada = true;
        document.getElementById('btn-skip').disabled = true;
        verificarAjudasEsgotadas();

        fecharModalAjudas();

        // Traz uma nova pergunta MANTENDO o mesmo nível e prêmio em disputa
        exibirPergunta();
    }

    /* --- LÓGICA DE PARAR --- */
    function pararJogo() {
        if (bloqueado) return;
        finalizarJogo(false, "Você escolheu parar!", true);
    }

    function resetarBotoes() {
        const btns = document.querySelectorAll('.btn-answer');
        btns.forEach(btn => {
            btn.className = 'btn-answer';
        });
    }

    function finalizarJogo(vitoria, mensagem = "", parou = false) {
        clearInterval(timerInterval);
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'flex';

        const titulo = document.getElementById('game-over-title');
        const msg = document.getElementById('game-over-msg');
        const premioFinal = document.getElementById('final-prize');

        if (vitoria) {
            titulo.innerText = "PARABÉNS! VOCÊ É UM MILIONÁRIO!";
            msg.innerText = "Você acertou todas as perguntas e ganhou:";
            premioFinal.innerText = formatarMoeda(1000000);
        } else if (parou) {
            titulo.innerText = "VOCÊ PAROU!";
            msg.innerText = "Você garantiu 50% do valor acumulado:";
            const valorFinal = valorAcumuladoAtual * 0.5;
            premioFinal.innerText = formatarMoeda(valorFinal);
        } else {
            titulo.innerText = "FIM DE JOGO!";
            msg.innerText = mensagem + " Você ficou com 20% do valor acumulado:";
            const valorFinal = valorAcumuladoAtual * 0.2; // Perde 80%
            premioFinal.innerText = formatarMoeda(valorFinal);
        }
    }

    function reiniciarJogo() {
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'flex';
        carregarPerguntasAutomaticamente();
    }
</script>

</body>
